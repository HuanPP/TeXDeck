name: Desktop release

# Push a tag like v0.2.0 to build every platform and publish a GitHub release.
# Pull requests that touch the build, and manual runs (Actions > Desktop
# release > Run workflow), only build: the packages stay as workflow artifacts.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "desktop/**"
      - "server/**"
      - "web/**"
      - "templates/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      TEXDECK_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '0.0.0-dev' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build web UI
        working-directory: web
        run: npm ci && npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install ./server pyinstaller pywebview

      - name: Install Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      # Freezes the app, then smoke-tests it: the frozen server renders a
      # template preview with the bundled Tectonic before anything is packaged.
      - name: Build desktop app
        run: python desktop/build.py

      - uses: actions/upload-artifact@v4
        with:
          name: texdeck-${{ matrix.os }}
          path: desktop/dist/release/*
          if-no-files-found: error

  publish:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "TeXDeck $GITHUB_REF_NAME" \
            --generate-notes
